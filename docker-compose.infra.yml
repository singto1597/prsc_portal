# /docker-compose.infra.yml
version: "3.8"
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shared_network
      - db-management
    deploy:
      replicas: 1

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - shared_network
    deploy:
      replicas: 1

volumes:
  # volume จริงของ Postgres/Redis — ตั้งชื่อตาม ENV_NAME
  # ⚠️ ใช้ key คงที่ (postgres_data/redis_data) + ระบุ name: dynamic
  #    (ห้ามใส่ ${ENV_NAME} ตรงๆ ที่ key — compose ไม่อนุญาต ตรวจแล้วด้วย `docker stack config`)
  postgres_data:
    name: ${ENV_NAME}_postgres_data
  redis_data:
    name: ${ENV_NAME}_redis_data

# ใช้ Alias ชื่อ shared_network แล้วชี้ name ไปที่ตัวแปร
networks:
  shared_network:
    name: app-internal-${ENV_NAME}
    external: true
  traefik-public:
    external: true
  db-management:
    external: true
